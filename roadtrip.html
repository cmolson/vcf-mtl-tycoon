      "<p><button type='button' class='pri'>Reload</button> <a href='" + String(window.VCF_GAME_URL || "../vcf-tycoon.html#pick").replace(/'/g, "%27") +
      "'>Back to VCF Tycoon</a></p>";
    d.querySelector("button").onclick = function () { location.reload(); };
    document.body.appendChild(d); var bt = d.querySelector("button"); if (bt) bt.focus();
  });
  // ---------------------------------------------------------------- build, in order
  RT.road.build(RT.ROUTE.legs[0]);                                  // paths, colliders for rails and fences
  RT.cars.build();                                                  // the player's car (the landmarks use the traffic kit's parts)
  RT.landmarks.build();                                             // kits, signs, pads, keep-outs, their colliders
  RT.road.plant();                                                  // trees and poles (after the keep-outs)
  RT.road.buildMeshes();                                            // the chunks (after every branch and rail is known)
  RT.traffic.build(); RT.chase.build(); RT.mech.build(); RT.cargo.build(); RT.pack.build(); RT.hud.build(); if (RT.sound) RT.sound.build();
  // the tabs: Drive is the pack view's "Drive →" (the packed card); Pack from the road asks first (the pause card's way out)
  RT.$("tabPack").onclick = function () { if (RT.mode() === "drive" && RT.flow.run) RT.flow.pause(); else RT.setMode("pack"); this.blur(); };
  RT.$("tabDrive").onclick = function () { if (RT.mode() === "pack") RT.emit("go", "drive"); this.blur(); };
  RT.on("mode", function (m) { RT.$("tabPack").setAttribute("aria-pressed", m === "pack"); RT.$("tabDrive").setAttribute("aria-pressed", m === "drive"); });
  // ---------------------------------------------------------------- every shader program now, behind the first screen
  RT.resize();
  RT.drive.reset(40); RT.traffic.reset(); RT.traffic.place(); RT.cars.update(0); RT.road.stream(40); RT.cam.snap();
  RT.precompile(RT.driveScene, RT.driveCam); RT.precompile(RT.pack.scene, RT.pack.camera);
  RT.stats.programsAtLoad = RT.programs();
  RT.setMode("pack"); RT.start();
  RT.flow.boot();                                                   // the cold open

  // ---------------------------------------------------------------- test hooks (headless checks, screenshots, benchmarks)
  var P = RT.P;
  function step(secs) { var n = Math.round(secs * 60), i; for (i = 0; i < n && !RT.hud.cardOpen() && !RT.flow.frozen; i++) RT.flow.step(1 / 60); return i; }   // stops at a card
  window.RT3 = {
    RT: RT, P: P,
    info: function () {
      var r = RT.renderer.info;
      return { mode: RT.mode(), calls: RT.stats.calls, tris: RT.stats.tris, programs: RT.programs(), programsAtLoad: RT.stats.programsAtLoad,
        geometries: r.memory.geometries, textures: r.memory.textures, s: +P.s.toFixed(1), d: +P.d.toFixed(2), y: +P.y.toFixed(2), kmh: Math.round(P.kmh),
        surf: P.surf, br: P.br, assist: P.assist, knocks: RT.cargo.knocks, crashes: P.crashes, air: P.air, counts: RT.road.counts };
    },
    frames: RT.frames, step: step,
    pack: function () { RT.setMode("pack"); }, drive: function () { RT.setMode("drive", "restart"); },
    auto: function () { return RT.pack.auto(); },
    put: function (s, d, rel, kmh) {                               // the car at road (s, d), turned rel rad from the road, at kmh
      RT.drive.place(s, d, -1, 0, 0); P.yaw += rel || 0; P.moveYaw = P.yaw; P.v = (kmh || 0) / 3.6; RT.road.restream(); RT.road.stream(P.s); RT.traffic.reset(); RT.cam.snap();
    },
    putB: function (id, u, e, kmh) { var b = RT.road.branch(id); RT.drive.place(0, 0, b.idx, u, e || 0); P.v = (kmh || 0) / 3.6; RT.road.restream(); RT.cam.snap(); },
    assist: function (on) { RT.drive.setAssist(on); }, cruise: function (v) { RT.drive.setCruise(v); },
    input: function (o) { var T = RT.touchIn; T.steer = o.steer || 0; T.gas = o.gas || 0; T.brake = o.brake || 0; },
    cam: function (m) { RT.cam.set(m); RT.cam.snap(); }, lane: function (d) { RT.drive.lane(d); },
    camAt: function (s, d, y, ls, ld, ly) {                          // a free camera for screenshots (until the next frame's rig update)
      RT.road.restream(); RT.road.stream(s + 100); var a = RT.road.frame(s, d), b = RT.road.frame(ls, ld); RT.driveCam.position.set(a.x, y, a.z); RT.driveCam.lookAt(b.x, ly, b.z); RT.render(RT.driveScene, RT.driveCam);
    },
    freeze: function (on) { RT.flow.frozen = !!on; }, overlaps: function () { return RT.traffic.overlaps(); },
    // the trip: its state, the card on top (title and buttons), press a card's button by label (or the primary), go to the
    // leg's end (s metres before it), the pause
    flow: function () { return RT.flow.state(); }, card: function () { return RT.hud.state(); }, press: function (l) { return RT.hud.press(l); },
    toEnd: function (m, kmh) { RT.drive.place(RT.road.end - (m || 200), RT.road.LANES[RT.road.LANES.length - 1], -1, 0, 0); P.v = (kmh || 100) / 3.6; RT.road.restream(); RT.cam.snap(); },
    pause: function () { RT.flow.pause(); }, result: function () { return RT.flow.result || null; },
    leg: function (id) { return RT.flow.test.leg(id); },          // the run jumps to that leg (its cards, clock and HUD as in play)
    look: function (on) { RT.touchIn.back = on ? 1 : 0; },        // hold LOOK BACK (or let go)
    chase: function () { return RT.chase.state0(); }, mech: function () { return RT.mech.state(); },
    skipIntro: function () { RT.hud.closeLayer(); RT.hud.closeCard(); RT.flow.paused = false; RT.flow.asking = false; RT.paused = false; RT.flow.frozen = false; return RT.mode(); },   // (the cold open blocks step)
    sim: function (secs, chaos) {                                   // drive without drawing; count traffic overlap frames (must stay 0)
      RT.flow.sim = true; if (!P.assist) RT.drive.setAssist(true);
      var bad = 0, n = Math.round(secs * 60), i, laps = 0, rnd = RT.rnd, stops = 0;
      for (i = 0; i < n; i++) {
        if (chaos && i % 97 === 0) RT.drive.lane(rnd() < 0.5 ? -1 : 1);
        if (chaos && i % 331 === 0) RT.drive.setCruise(60 + ((rnd() * 8) | 0) * 10);
        if (chaos && i % 600 === 561) RT.drive.brakeFor(0.65);      // (a brake that keeps the Autopilot on)
        RT.flow.step(1 / 60); if (RT.traffic.overlaps()) bad++;
        if (P.ended) { laps++; RT.flow.start(); RT.flow.frozen = true; }
        if (RT.hud.cardOpen() && RT.hud.cardPrimary) { RT.hud.cardPrimary.click(); stops++; }   // answer a card the sensible way
      }
      RT.touchIn.brake = 0; RT.drive.setCruise(100); RT.flow.sim = false;
      return { steps: n, overlapFrames: bad, laps: laps, cards: stops, knocks: RT.cargo.knocks, s: Math.round(P.s) };
    }
  };
})();

</script>
