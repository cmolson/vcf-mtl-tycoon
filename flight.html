       ["Répondre en français", function () { R.french = true; radio([["TDK:", "Bonjour, " + D.CALLSHORT + ", on rappelle le fleuve en vue."]]); }, true]], { kick: "Pointe-Fortune · Bienvenue au Québec" });
  }

  // ---------------------------------------------------------------- the fuel stop, and the night
  function stopCard(id) {                                            // a fuel stop is a toast and straight on; the night stop (or a hard landing) is a card
    var bought = Math.max(0, L.fuel - P.fuel); R.fuelBought += bought;
    var ld = R.lands[R.lands.length - 1], res = R.resv[R.resv.length - 1], B = D.BASES[id], next = R.legs[R.li + 1];
    P.clock += D.STOP_MIN;
    var g = FL.plan.legInfo(next[0], next[1], L.power), nb = D.BASES[next[1]], day = Math.floor((P.clock - 300) / 1440);
    var sunset = nb.sun[Math.min(day, 1)][1] + day * 1440, night = P.clock + D.TAXI_MIN + g.min > sunset, hard = ld && ld.q < 0.6 && !ld.auto;
    var nextLine = esc(shortName(next[1])) + ", " + Math.round(g.nm) + " nm, about " + Math.floor(g.min / 60) + " h " + ("0" + Math.round(g.min % 60)).slice(-2);
    function go() { if (night) { P.clock = B.sun[Math.min(day + 1, 1)][0] + (day + 1) * 1440 - D.TAXI_MIN; R.day = day + 1; } P.fuel = L.fuel; P.cruise = L.power; R.li++; leg(); }
    var unbal = PL.wbs.tail > 0.3 || PL.wbs.nose > 0.3;
    if (!night && !hard && !unbal) {
      H().toast(shortName(id) + ": " + bought.toFixed(1) + " gal of 100LL in (landed with " + Math.round(res.min) + " min). Next: " + shortName(next[1]) + ", " + Math.round(g.nm) + " nm. " + (D.STOPLINE[id] || ""), 7);
      R.quickStops = (R.quickStops || 0) + 1; go(); return;
    }
    var h = "<dl class='rows'><div><dt>Landing</dt><dd>" + esc(ld ? ld.word : "") + "</dd></div><div><dt>Fuel</dt><dd>landed with " + res.gal.toFixed(1) + " gal (" + Math.round(res.min) + " min); " +
      bought.toFixed(1) + " gal of 100LL in</dd></div><div><dt>Next</dt><dd>" + nextLine + "</dd></div></dl>" +
      "<p>" + esc(D.STOPLINE[id] || "") + "</p>";
    if (night) {
      var dawn = B.sun[Math.min(day + 1, 1)][0] + (day + 1) * 1440;
      h += "<p><b>The light won't last to " + esc(shortName(next[1])) + "</b>: sunset there is " + D.hhmm(sunset, nb.lon, true) + ". The Beaver stays tied up here tonight; off again at first light, " + D.hhmm(dawn + D.TAXI_MIN, B.lon) + ".</p>";
      R.night = id;
    }
    if (unbal) h += "<p class='warn'>She's " + (PL.wbs.tail > PL.wbs.nose ? "tail-heavy: " + esc(culprit(true)) + " is doing the most" : "nose-heavy: " + esc(culprit(false))) + ". Re-stow the load here.</p>";
    h += "<div class='seg' id='spow'>" + D.CRUISE.map(function (c) { var gi = FL.plan.legInfo(next[0], next[1], c[0]), rv = (L.fuel - gi.gal) / D.gph(c[0]) * 60;
      return "<button type='button' data-p='" + c[0] + "' aria-pressed='" + (L.power === c[0]) + "'" + (rv < 30 ? " class='bad'" : "") + ">" + c[1] + " <small>" + (rv < 30 ? "short: " : "+") + Math.round(rv) + " min</small></button>"; }).join("") + "</div>" +
      "<p class='note'>Cruise power from here: 75 % is about " + Math.round(D.tas(0.75)) + " kt on " + Math.round(D.gph(0.75)) + " gal/h, 55 % about " + Math.round(D.tas(0.55)) + " kt on " + Math.round(D.gph(0.55)) + ": less fuel, less daylight.</p>";
    H().card(night ? "Night at " + shortName(id) : shortName(id), h, [["Re-stow the load, then go", function () { F.restow(go); }], [night ? "Sleep, then take off ▸" : "Take off ▸", go, true]], { kick: (night ? "The night stop · " : "Fuel stop · ") + D.hhmm(P.clock, B.lon),
      after: function (cd) { [].forEach.call(cd.querySelectorAll("#spow button"), function (b) { b.addEventListener("click", function () { L.power = +b.getAttribute("data-p");
        [].forEach.call(cd.querySelectorAll("#spow button"), function (x) { x.setAttribute("aria-pressed", x === b); }); }); }); } });
  }

  // ---------------------------------------------------------------- the arrival: the river, the footbridge, the last 40 metres
  function arrive() {                                                // down on the river: straight to the last 40 metres (the facts go on the dash's first toast)
    R.arrive = P.clock;
    var items = FL.cargo.loaded().filter(function (it) { return !it.tool; }), truck = L.zone.truck !== "home";
    FL.setMode("dash"); FL.dash.start(items, L.pax, truck);
    var when = R.arrive <= D.SUNSET ? "before sunset" : R.arrive <= D.SETUP ? "after sunset, before setup" : "after setup started";
    H().toast("On the St. Lawrence at " + D.hhmm(R.arrive, -73.5, true) + ", " + when + ". " + D.CALL + " is tied below Route 132; the load is over the footbridge, at the bus stop. The college is across Riverside. " +
      (truck ? "The hand truck takes 400 lb a trip" + (L.pax ? ", and your passenger 70 lb more" : "") + "." : "No hand truck: 70 lb a trip, and anything heavier needs a second pair of hands."), 9);
    FL.emit("arrived", R.arrive);
  }
  FL.defMode("dash", {
    update: function (dt) {
      if (H().cardOpen()) return;
      if (FL.hit("Escape")) { F.pause(); return; }
      FL.dash.keys(); FL.dash.step(dt); FL.dash.render(dt);
    },
    resize: function (w, h) { FL.dash.resize(w, h); },
    render: function () { FL.render(FL.dash.scene, FL.dash.cam); }
  });
  FL.on("dashdone", function () { if (R) { R.dashT = FL.dash.S.t; setTimeout(final, 50); } });
  FL.on("nearmiss", function () { H().toast("Brakes, horn. Back to the curb" + (FL.dash.S.truck.length ? ", and the load took a jolt." : ".")); });
  FL.on("bell", function () { H().toast("A cyclist in the bike lane, in November, in shorts. A bell, then gone."); });
  FL.on("helper", function (who) { H().toast(who === "pax" ? "Your passenger takes the other end." : "Jonah comes out of the college to take the other end. He goes back in after this trip.", 3.5); });
  F.score = function () {
    var ds = FL.dash.S, cr = FL.cargo.result(ds ? ds.inside : null), parts = [], tot = 0;
    var cargo = Math.round(Math.min(1, cr.val / SC.valFull) * SC.cargo);
    var bb = R.bal || { tail: 0, nose: 0 }, wb = R.legal ? Math.round(SC.wb - 40 * FL.clamp((Math.max(bb.tail, bb.nose) - 0.25) / 0.75, 0, 1)) : 0;   // (legal and balanced: full; toward a limit, less)
    var minRes = R.resv.reduce(function (m, r) { return Math.min(m, r.min); }, 1e9);
    var fuel = Math.max(0, (minRes >= 45 ? SC.fuel : minRes >= 30 ? 95 : minRes >= 15 ? 45 : 15) - 40 * R.dry);   // (out of fuel: the boat costs 40 and the time)
    var lw = R.lands.reduce(function (s, l) { return s + (l.w || 1); }, 0), lq = lw ? R.lands.reduce(function (s, l) { return s + l.q * (l.w || 1); }, 0) / lw : 0, land = Math.round(lq * SC.land);   // (the river counts double)
    var t = R.arrive, time = t <= D.SUNSET ? SC.time : t <= D.SETUP ? Math.round(SC.time - (t - D.SUNSET) / (D.SETUP - D.SUNSET) * 40) : Math.max(0, Math.round(SC.time - 40 - (t - D.SETUP) * 1.5));
    var hz = FL.haz.st, nph = Object.keys(hz.photos).length;
    var air = Math.min(SC.air, (hz.fireBust ? 0 : hz.fireHand ? 20 : 10) + (hz.watched ? 15 : 0) + (hz.reported ? 25 : hz.balloonClose ? 0 : 10) + Math.min(SC.photoMax, nph) * SC.photo);
    var dsh = ds ? Math.max(0, Math.round(SC.dash - ds.near * 30 - ds.honks * 5 - Math.max(0, ds.t - SC.dashPar) * 0.5)) : 0;   // (by the book fits inside the par)
    parts.push(["Cargo", cr.made.length + " of " + (cr.made.length + cr.home.length + cr.broke.length) + " things working at the booth" + (L.pax ? ", and a passenger" : ""), cargo, SC.cargo]);
    parts.push(["Weight and balance", R.legal ? (Math.max(bb.tail, bb.nose) > 0.05 ? "legal, " + (bb.tail > bb.nose ? "tail-heavy" : "nose-heavy") : "legal and balanced") + (R.restows ? ", re-stowed " + R.restows + "×" : "") : "flown outside the limits", wb, SC.wb]);
    parts.push(["Fuel", (R.dry ? "ran dry " + R.dry + "× (fuel by boat), " : "") + (R.diverts ? R.diverts + (R.diverts > 1 ? " diversions, " : " diversion, ") : "") + "lowest on landing: " + Math.round(minRes) + " min", fuel, SC.fuel]);
    parts.push(["Landings", R.lands.length + " on the water: " + R.lands.map(function (l) { return l.word; }).join(", ") + " (the river counts double)", land, SC.land]);
    parts.push(["Daylight", "on the river " + D.hhmm(t, -73.5), time, SC.time]);
    parts.push(["Airmanship", (hz.fireBust ? "inside the fire's ring" : hz.fireHand ? "clear of the fire, by hand" : "clear of the fire (the autopilot's line)") + (hz.reported ? ", balloon reported" : "") + ", " + nph + (nph === 1 ? " photo" : " photos"), air, SC.air]);
    parts.push(["The last 40 metres", ds ? ds.trips + " trips, " + Math.round(ds.t) + " s" + (ds.near ? ", " + ds.near + (ds.near > 1 ? " near-misses" : " near-miss") : "") : "", dsh, SC.dash]);
    if (D.PLANES[R.plane] && D.PLANES[R.plane].charter) parts.push(["The Otter's charter", "a bigger plane, someone else's", -D.PLANES[R.plane].charter, 0]);
    parts.forEach(function (p) { tot += p[2]; }); tot = Math.max(0, tot);
    var st = 0; SC.stars.forEach(function (s) { if (tot >= s) st++; });
    return { total: tot, stars: st, parts: parts, cargo: cr, minRes: minRes };
  };
  function final() {
    R.done = true;
    var sc = F.score(), cr = sc.cargo, hz = FL.haz.st, ds = FL.dash.S;
    F.result = { total: sc.total, stars: sc.stars, parts: sc.parts.map(function (p) { return [p[0], p[2], p[3]]; }), arrive: R.arrive, lands: R.lands, hits: hz.hits, shooed: hz.shooed,
      used: hz.used, photos: Object.keys(hz.photos), reported: hz.reported, fireBust: hz.fireBust, watched: hz.watched, legal: R.legal, stops: R.stops, night: R.night,
      dash: ds ? { t: Math.round(ds.t), trips: ds.trips, near: ds.near, inside: ds.inside.length } : null };
    var best = -1; try { best = +(localStorage.getItem("vcf-flight-best") || -1); if (sc.total > best) localStorage.setItem("vcf-flight-best", sc.total); } catch (e) { }
    var h = '<dl class="rows score">';
    sc.parts.forEach(function (p) { h += "<div><dt>" + esc(p[0]) + "</dt><dd><b>" + p[2] + "</b> / " + p[3] + " <span class='part'>" + esc(p[1]) + "</span></dd></div>"; });
    h += "</dl><dl class='rows'>";
    function row(a, b) { h += "<div><dt>" + esc(a) + "</dt><dd>" + b + "</dd></div>"; }
    row("At the booth", esc(cr.made.map(function (i) { return i.name; }).join(", ") || "nothing"));
    row("Stayed in Lynn Lake", esc(cr.home.filter(function (i) { return !i.tool; }).map(function (i) { return i.name; }).join(", ") || "nothing"));
    row("Broke", cr.broke.length ? "<span class='bad'>" + esc(cr.broke.map(function (i) { return i.name + ": won't power up"; }).join("; ")) + "</span>" : "nothing");
    var u = hz.used, uc = [];
    if (u.cards) uc.push(u.cards + (u.cards > 1 ? " cartons" : " carton") + " of punched cards"); if (u.reels) uc.push(u.reels + (u.reels > 1 ? " reels" : " reel") + " of tape");
    if (u.tdk) uc.push(u.tdk + (u.tdk > 1 ? " cassettes" : " cassette"));
    row("Geese", hz.flocks + " flocks · " + (hz.hits ? hz.hits + (hz.hits > 1 ? " hit the plane" : " hit the plane") : "none hit the plane") + (uc.length ? " · out the window: " + esc(uc.join(", ")) : ""));
    row("Fuel stops", R.stops.slice(1, -1).map(shortName).join(", ") + (R.night ? " · the night at " + esc(shortName(R.night)) : ""));
    if (R.goArounds) row("Go-arounds", String(R.goArounds));
    h += "</dl><p class='total'>Flight score <b>" + sc.total + "</b> / 1000 <span class='stars' role='img' aria-label='" + sc.stars + " of 5 stars'>" + stars(sc.stars) + "</span></p>" +
      "<p class='note'>" + (best < 0 ? "Your first flight." : sc.total > best ? "New best! Your old best was " + best + "." : "Your best: " + best + ".") + "</p>";
    H().card("The big iron is in", h, [["Fly it again", function () { F.again(); }], ["Continue to Friday ▸", function () {
        try { if (window.parent !== window) window.parent.postMessage({ flight: "done", score: sc.total }, "*"); } catch (e) { /* not framed */ }
        FL.leave(); }, true]],
      { kick: "Friday, November 6 · Champlain College Saint-Lambert", wide: true });
    FL.emit("tripdone", F.result);
  }
  F.active = function () { return !!R && !R.done; };                 // mid-run (flying, the dash, re-stowing): the corner button asks before it leaves
  F.again = function () { R = F.R = null; FL.warp = 1; FL.setMode("pack"); };

  // ---------------------------------------------------------------- pause
  F.pause = function () {
    if (H().cardOpen() || H().asking()) return;
    FL.paused = true; if (FL.sound) FL.sound.pause(true);
    H().card("Paused", "<p class='note'>Options (each button turns on or off):</p><div class='sw'><button type='button' id='pInv' aria-pressed='" + !!FL.invert + "'>" + (FL.touch ? "Stick: drag up to climb" : "Pitch like a yoke (↑ dives)") + "</button><button type='button' id='pSnd' aria-pressed='" + !(FL.sound && FL.sound.muted) + "'>Sound <kbd>M</kbd></button></div>",
      [["Back to VCF Tycoon", null, false, FL.GAME], ["Back to loading", function () { FL.paused = false; F.again(); }]].concat(FL.mode() === "fly" && R ? [["The load", function () { resume(); loadCard(); }]] : []).concat([["Resume", resume, true]]), { kick: "The flight", esc: resume, after: function (cd) {
        cd.querySelector(".row a").id = "bHomeP";
        cd.querySelector("#pInv").addEventListener("click", function () { FL.invert = !FL.invert; this.setAttribute("aria-pressed", FL.invert); });
        cd.querySelector("#pSnd").addEventListener("click", function () { var m = FL.sound.toggle(); this.setAttribute("aria-pressed", !m); });
      } });
  };
  function resume() { FL.paused = false; if (FL.sound) FL.sound.pause(false); }
  document.addEventListener("visibilitychange", function () { if (document.hidden && R && (FL.mode() === "fly" || FL.mode() === "dash") && !H().cardOpen()) F.pause(); });   // (a hidden tab pauses: no flying on without you)
  F.state = function () { return R ? { ga: R.gaLog, li: R.li, legs: R.legs.length, stops: R.stops, lands: R.lands, goArounds: R.goArounds, clock: Math.round(P.clock), legT: +R.legT.toFixed(1) } : null; };
})();

// ---------------------------------------------------------------- The Flight: boot.js (FLIGHT-PREQUEL)
// The build order, the shader precompile (both scenes, everything shown once), the first card, and the test hooks
// (window.FT). Runs last.
(function () {
  "use strict";
  var FL = window.FL;
  if (!FL || !FL.ok) {
    var v = document.getElementById("view");
    if (v) v.innerHTML = "<div id='nogl'><p><b>The flight needs WebGL</b>, which this browser doesn't offer.</p></div>";
    return;
  }
  FL.world.build(); FL.plane.build(); FL.haz.build(); FL.pack.build(); FL.hud.build(); FL.dash.build();
  FL.$("bAuto").onclick = function () { FL.pack.auto(); this.blur(); };
  FL.$("bClear").onclick = function () { if (!(FL.flow.R && FL.flow.R.restowing)) { FL.D.ITEMS.forEach(function (it) { FL.load.zone[it.id] = "home"; }); FL.pack.refresh(); } this.blur(); };   // (re-stowing: nothing comes off)
  FL.$("bReady").onclick = function () { FL.flow.ready(); this.blur(); };
  FL.on("packed", function (st) { var why = FL.$("readyWhy"); FL.setText(why, st.wb.room.length ? "Doesn't fit" : !st.plan ? "Not enough fuel" : !st.legal ? "Not legal" : "");
    FL.$("bReady").classList.toggle("dim", !st.legal || !st.plan); });
  FL.resize();
  // every program now, behind the first card: the fly scene with the plane on the runway, then the cabin
  FL.plane.setLeg("CKD3", "CKD6"); FL.plane.reset("CKD3"); FL.plane.pose(0); FL.plane.cam(1, true);
  FL.haz.spawnFlock(3, false); FL.haz.burst(FL.P.x, FL.P.y + 3, FL.P.z, 4, 0xffffff, 1, 1, "paper"); FL.haz.step(1 / 60);
  FL.precompile(FL.flyScene, FL.flyCam); FL.render(FL.flyScene, FL.flyCam);
  FL.precompile(FL.pack.scene, FL.pack.camera); FL.render(FL.pack.scene, FL.pack.camera);
  FL.dash.start(FL.D.ITEMS.slice(0, 3), false, true); FL.dash.render(0); FL.precompile(FL.dash.scene, FL.dash.cam); FL.render(FL.dash.scene, FL.dash.cam);
  FL.haz.reset(); FL.stats.maxCalls = 0; FL.stats.maxTris = 0;
  FL.stats.programsAtLoad = FL.programs();
  FL.setMode("pack"); FL.start();
  FL.flow.coldOpen();

  // ---------------------------------------------------------------- test hooks
  var P = FL.P;
  function step(secs) { var n = Math.round(secs * 60), i; for (i = 0; i < n && !FL.hud.cardOpen() && !FL.flow.frozen; i++) FL.flow.step(1 / 60); return i; }
  window.FT = {
    FL: FL, P: P, step: step,
    info: function () { var r = FL.renderer.info; return { mode: FL.mode(), calls: FL.stats.calls, tris: FL.stats.tris, maxCalls: FL.stats.maxCalls, maxTris: FL.stats.maxTris,
      programs: FL.programs(), programsAtLoad: FL.stats.programsAtLoad, geometries: r.memory.geometries, textures: r.memory.textures,
      x: Math.round(P.x), y: +P.y.toFixed(1), kt: Math.round(P.kt), fuel: +P.fuel.toFixed(1), clock: Math.round(P.clock), pmode: P.mode, ap: P.ap, pi: P.pi, onFinal: P.onFinal }; },
    card: function () { return FL.hud.state(); }, press: function (l) { return FL.hud.press(l); },
    auto: function () { return FL.pack.auto(); }, ready: function () { FL.flow.ready(); }, pick: function (id) { FL.flow.pick(id); },
    wb: function () { var c = FL.wb.calc(); return { w: Math.round(c.w), cg: +c.cg.toFixed(2), legal: c.legal, room: c.room, why: c.why, bag: c.bag }; },
    plans: function () { return FL.plan.options(FL.load.fuel, FL.load.power).map(function (o) { return { stops: o.stops, arr: Math.round(o.arr), reserve: Math.round(o.reserve) }; }); },
    ap: function (on) { FL.plane.ap(on, "test"); }, haz: function () { return FL.haz.state(); }, flow: function () { return FL.flow.state(); }, result: function () { return FL.flow.result || null; },
    chaff: function () { return FL.haz.chaff(); }, photo: function () { return FL.haz.photo(); }, cam: function (m) { FL.plane.camMode = m; FL.plane.cam(1, true); },
    render: function () { FL.plane.pose(0); FL.plane.cam(1, true); FL.haz.sky(); FL.hud.update(1, null); FL.render(FL.mode() === "fly" ? FL.flyScene : FL.pack.scene, FL.mode() === "fly" ? FL.flyCam : FL.pack.camera); return { calls: FL.stats.calls, tris: FL.stats.tris }; },
    // fly: step with the autopilot, answering cards with their primary button, until the final card (or max seconds)
    dash: function () { return FL.dash.state(); },
    dashBot: function (maxSecs) { FL.dash.autoBot(); var n = 0; while (n < maxSecs * 60 && FL.mode() === "dash" && !FL.dash.S.done) { FL.dash.step(1 / 60); n++; } FL.dash.bot = null; return FL.dash.state(); },
    // play: a player on the autopilot, frame by frame as the page runs it (x4 on by default; opt.skip: presses Skip whenever it can;
    // opt.x1: real time throughout; opt.cardSecs: the wall time spent on each card). Returns the wall seconds from the engine start to the river.
    play: function (maxWall, opt) {
      opt = opt || {}; var wall = 0, cards = [], f = 0, log = [], t0 = performance.now(), by = {};
      if (opt.x1) FL.warpWant = 1;
      FL.on("radio", function (l) { if (log.length < 200) log.push([+wall.toFixed(1), l[0] + " " + l[1].slice(0, 40)]); });
      while (wall < maxWall) {
        if (FL.mode() !== "fly") break;
        if (FL.hud.cardOpen()) { var c = FL.hud.state(); cards.push(c.title); wall += opt.cardSecs === undefined ? 4 : opt.cardSecs; FL.hud.press(); continue; }
        if (!P.ap) FL.plane.ap(true, "test");
        if (opt.x1) FL.warpWant = 1;
        if (opt.skip && !FL.flow.skip && FL.flow.canWarp()) FL.flow.skip = true;
        var why = FL.flow.skip ? "skip" : FL.warp > 1 ? "x4" : P.mode !== "air" ? "water" : P.onFinal || P.pi >= FL.plane.fafIdx() - 1 ? "approach" : FL.haz.st.inRough || FL.haz.st.smoke > 0 || FL.haz.st.sq > 0 ? "rough" :
          FL.haz.flocksNear().d < 1600 ? "geese" : Math.hypot(P.x - FL.haz.fire.x, P.z - FL.haz.fire.z) < 1400 ? "fire" : FL.haz.st.balloonSeen && !FL.haz.st.reported && !FL.haz.st.balloonGone ? "balloon" : P.warn ? "warn" : P.orbit ? "orbit" : "other";
        by[why] = (by[why] || 0) + 1 / 60;
        FL.flow.tick(1 / 60); wall += 1 / 60; f++;
      }
      for (var k in by) by[k] = +by[k].toFixed(1);
      return { wall: +wall.toFixed(1), cards: cards, frames: f, log: log, by: by, ms: Math.round(performance.now() - t0) };
    },
    fly: function (maxSecs, opt) {
      opt = opt || {}; var n = 0, cards = [], samples = [], t0 = performance.now(), lastS = -1;
      FL.test = true;
      while (n < maxSecs * 60) {
        if (FL.hud.cardOpen()) {
          var c = FL.hud.state(); cards.push(c.title);
          if (c.title === "The big iron is in") break;
          FL.hud.press(); continue;
        }
        if (FL.mode() !== "fly") break;
        if (!P.ap) FL.plane.ap(true, "test");
        var cq = FL.haz.cue(); if (opt.chaff && cq && cq.inRange) FL.haz.chaff();
        FL.flow.step(1 / 60); n++;
        if (opt.every && n % opt.every === 0) { var r = FT.render(); samples.push(r); }
        if (opt.watch && n % 30 === 0) opt.watch(n);
      }
      FL.test = false;
      return { secs: +(n / 60).toFixed(1), cards: cards, samples: samples, ms: Math.round(performance.now() - t0) };
    }
  };
})();
