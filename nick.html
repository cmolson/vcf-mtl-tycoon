  NX.on("jay", function (why) { ui.toast(why === "mid" ? "Mid-block, away from the crosswalk: −40 crossing points." : "Against the hand: −40 crossing points.", "bad"); });
  NX.on("vanBack", function () { ui.toast("A cube van backs along the drive, beeping."); });
  NX.on("arrive", function (sc) { if (NX.manual) ui.final(sc); else setTimeout(function () { ui.final(sc); }, 700); });
  NX.on("late", function (sc) { ui.final(sc); });

  // ---------------------------------------------------------------- the HUD (written only when a value changes)
  function set(k, v, html) { if (last[k] === v) return; last[k] = v; if (html) E[k].innerHTML = v; else E[k].textContent = v; }
  function objective(S) {
    var n = S.nick, g = S.sig, z = S.zone, k = z === "north" ? 0 : 1;
    if (!S.playing) return "";
    if (S.done) return S.late ? "17:00." : "Inside. Room D 121.";
    if (n.resp > 0) return "Back to the curb.";
    if (n.talk > 0) return "On the radio.";
    if (z === "north" || z === "median") {
      if (g.ped[k] === "walk") return "Walk.";
      if (g.ped[k] === "flash") return "Don't start: " + g.n[k] + " s.";
      if (!g.called[k] && !g.serve[k]) return k ? (ui.touch ? "The median has its own button." : "The median has its own button (E).") : sim.nearBtn() === 0 ? (ui.touch ? "Tap Button." : "Press the crossing button (E).") : ui.touch ? "Walk to the crossing button on the pole, then tap Button." : "Walk to the crossing button on the pole, then press E.";
      return k ? "Wait on the median. Stand back from the edges." : "Wait for the walking man. Stand back from the curb.";
    }
    if (z === "lane") { var h = n.z < L.median[0] ? 0 : 1; return g.ped[h] === "dont" ? "The cars have the green. Get across." : g.ped[h] === "flash" ? "Finish crossing: " + g.n[h] + " s." : "Keep going."; }
    if (z === "buffer" || z === "bike") return "The bike lane: look both ways.";
    if (sim.vanNear()) return "Let the van back in.";
    return "The doors, straight ahead.";
  }
  var L = NX.L;
  ui.frame = function (dt) {
    var S = sim.S; if (!S) return;
    for (var i = toasts.length - 1; i >= 0; i--) { toasts[i].t -= dt; if (toasts[i].t <= 0) { var o = toasts.splice(i, 1)[0]; if (o.el.parentNode) o.el.parentNode.removeChild(o.el); } }
    hudT -= dt; if (hudT > 0) return; hudT = 0.1;
    set("clk", NX.hhmm(NX.T0 + S.t * NX.CLOCK));
    var c = Math.round(S.coffee * 100);
    set("cuptxt", c > 0 ? c + "% · " + Math.round(S.temp) + " °C" : "Gone");
    if (last.cupw !== c) { last.cupw = c; E.cupbar.style.width = c + "%"; E.cup.className = "led" + (c < 40 ? " low" : ""); }
    var ob = objective(S); set("obj", ob);
    // for screen readers: the objective when it changes kind, not each second of a countdown (#obj itself isn't live)
    var kind = ob.replace(/\d+/g, "#"); if (kind !== last.objKind) { last.objKind = kind; E.sr.textContent = ob; }
    // the signal chip: the head that matters to you right now
    var st = S.zone === "north" ? 0 : S.zone === "median" || (S.zone === "lane" && S.nick.z > L.median[0]) ? 1 : -1;
    var key = !S.playing || S.done || st < 0 ? "off" : S.sig.ped[st] + S.sig.n[st] + (S.sig.ped[st] === "flash" ? Math.floor(S.t * 2) % 2 : "");
    if (key !== sigKey) {
      sigKey = key; E.sig.className = key === "off" ? "" : "on";
      if (key !== "off") NX.W.headChip(E.sctx, S.sig.ped[st], S.sig.n[st], Math.floor(S.t * 2) % 2);
    }
    // the radio
    var r = S.radio, rk, txt;
    if (r.talking) { rk = "talk" + r.talking.i; txt = "<span class=\"who\">You:</span> “" + esc(r.talking.answer) + "”"; }
    else if (r.cur) { rk = "call" + r.cur.i; txt = "<span class=\"who\">" + esc(r.cur.who) + ":</span> “" + esc(r.cur.text) + "”"; }
    else if (r.said) { rk = "said" + r.said.i; txt = "<span class=\"who\">" + esc(r.said.who) + ":</span> “OK.”"; }
    else { rk = S.playing ? "off" : "idle"; txt = S.playing ? "Quiet." : ""; }
    if (last.rk !== rk) {
      last.rk = rk; E.rtext.innerHTML = txt;
      E.radio.className = r.cur && !r.talking ? "live" : r.talking || r.said ? "said" : rk === "idle" ? "off idle" : "off";
      E.rbtn.disabled = !(r.cur && !r.talking); E.tRadio.className = r.cur && !r.talking ? "ready" : "";
    }
    set("rq", r.offered || r.answered ? r.answered + " of " + r.offered + " answered" : "");
    var frac = r.cur && !r.talking ? NX.clamp((r.until - S.t) / 11, 0, 1) : 0, fw = Math.round(frac * 50);
    if (last.rbar !== fw) { last.rbar = fw; E.rbarS.style.width = fw * 2 + "%"; }
    E.tBtn.className = sim.nearBtn() >= 0 && S.playing && !S.done ? "ready" : "";
  };
  ui.objective = function () { return objective(sim.S); };
  ui.reset = function () { last = {}; sigKey = ""; toasts.forEach(function (o) { if (o.el.parentNode) o.el.parentNode.removeChild(o.el); }); toasts = []; };
})();

// ---------------------------------------------------------------- Nick's prequel: boot.js
// The renderer, the lights and the sky (dusk, darkening as the clock runs), the camera (the opening shot from the college
// side, then over Nick's shoulder), the frame loop (fixed 1/60 s steps), and copying the sim onto the meshes.
// Every material exists before the first frame and is compiled at load (renderer.compile with everything shown once).
//   NX.go() (the opening card's Cross), NX.restart(), NX.render(), NX.info() -> { calls, tris, programs, programsAtLoad }
//   NX.manual = true: the loop stops stepping and drawing (tests step with NX.advance(sec) and draw with NX.render()).
(function () {
  "use strict";
  var W = NX.W, sim = NX.sim, renderer, scene, camera, hemi, sun, fog, programsAtLoad = 0;
  var camPos = new THREE.Vector3(), camLook = new THREE.Vector3(), tPos = new THREE.Vector3(), tLook = new THREE.Vector3();
  var DUSK0 = new THREE.Color(0x5d6784), DUSK1 = new THREE.Color(0x161b2c), skyC = new THREE.Color();
  var vel = null, spN = 0, sndT = 0, introT = 0, mode = "intro";

  function boot() {
    var cv = document.getElementById("c");
    try { renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, powerPreference: "high-performance" }); }
    catch (e) { NX.fail("This needs WebGL, and this browser didn't start it. Try another browser, or go on to the game."); return; }
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    scene = new THREE.Scene(); scene.background = DUSK0.clone();
    fog = scene.fog = new THREE.Fog(DUSK0.getHex(), 40, 230);
    hemi = new THREE.HemisphereLight(0x9aa6c8, 0x3a3428, 0.85); scene.add(hemi);
    sun = new THREE.DirectionalLight(0xffc89a, 0.45); sun.position.set(-60, 18, 40); scene.add(sun);
    camera = new THREE.PerspectiveCamera(55, 1, 0.1, 4000);
    W.build(scene); sim.build(); sim.reset();
    vel = new Float32Array(W.pts.n * 3);
    NX.ui.init(); resize(); addEventListener("resize", resize);
    // compile every program now: show everything once
    var hidden = [];
    scene.traverse(function (o) { if (o.isMesh && !o.visible) { hidden.push(o); o.visible = true; } });
    renderer.compile(scene, camera); renderer.render(scene, camera);
    hidden.forEach(function (o) { o.visible = false; });
    sim.reset(seed()); sync(0);
    renderer.render(scene, camera);
    programsAtLoad = renderer.info.programs.length;
    NX.ui.intro();
    requestAnimationFrame(loop);
  }
  function resize() {
    var w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h;
    camera.fov = w / h < 0.8 ? 66 : 55; camera.updateProjectionMatrix();
  }

  // a new seed for each run (different gaps in the traffic); the tests (NX.manual) keep 1107
  function seed() { return NX.manual ? 1107 : ((Date.now() ^ (Math.random() * 0x7fffffff)) & 0x7fffffff) + 1; }
  NX.go = function () { NX.snd.unlock(); sim.start(); mode = "play"; introT = 0; };
  NX.restart = function () { NX.ui.reset(); sim.reset(seed()); for (var i = 0; i < vel.length; i++) vel[i] = 0; mode = "play"; sim.start(); sync(0); };

  // ---------------------------------------------------------------- the loop
  var lastT = 0, acc = 0, STEP = 1 / 60;
  function loop(ts) {
    requestAnimationFrame(loop);
    if (NX.manual) { lastT = 0; return; }
    var dt = lastT ? Math.min(0.1, (ts - lastT) / 1000) : STEP; lastT = ts;
    if (!NX.ui.paused) {
      acc += dt; var n = 0;
      while (acc >= STEP && n < 6) { stepOnce(); acc -= STEP; n++; }
      if (n === 6) acc = 0;
    }
    sync(dt); NX.ui.frame(dt); NX.render();
    sndT -= dt; if (sndT <= 0) { NX.snd.tick(0.1 - sndT); sndT = 0.1; }
  }
  function stepOnce() {
    var S = sim.S;
    var holding = NX.ui.input(sim.input);
    if (holding && S.playing) sim.holdBtn(STEP);
    sim.step(STEP);
  }
  NX.advance = function (sec, each) {                       // tests: step the sim (each(t) is called every step; true stops)
    var n = Math.round(sec / STEP);
    for (var i = 0; i < n; i++) { if (each && each(sim.S.t)) break; stepOnce(); if (sim.S.done && !each) break; }
    sync(sec); NX.ui.frame(1);
  };
  NX.render = function () { renderer.render(scene, camera); };
  NX.info = function () {
    var r = renderer.info.render;
    return { calls: r.calls, tris: r.triangles, programs: renderer.info.programs.length, programsAtLoad: programsAtLoad };
  };
  NX.camera = function () { return camera; };

  // ---------------------------------------------------------------- sim -> meshes
  function sync(dt) {
    var S = sim.S, P = sim.pool, i, o;
    for (i = 0; i < P.length; i++) { o = P[i]; if (o.on) o.mesh.position.set(o.x, 0, o.z); }
    var c = sim.cyc(); if (c.on) c.mesh.position.set(c.x, 0, c.z);
    var v = sim.van(); v.mesh.position.set(v.x, 0, v.z);
    var lc = sim.loc(); lc.mesh.position.set(lc.x, lc.moving && !NX.reduced ? Math.abs(Math.sin(lc.ph)) * 0.04 : 0, lc.z); lc.mesh.rotation.y = lc.face;
    // Nick
    var n = S.nick, N = W.nick, sw = n.moving ? Math.sin(n.ph) * (n.spd > 2 ? 0.75 : 0.5) : 0;
    N.g.position.set(n.x, n.moving && n.spd > 2 ? Math.abs(Math.sin(n.ph)) * 0.05 : 0, n.z);
    N.g.rotation.y = n.face; N.legL.rotation.x = sw; N.legR.rotation.x = -sw;
    N.armR.rotation.x = n.talk > 0 ? -2.5 : -sw * 0.6; N.armR.rotation.z = n.talk > 0 ? 0.35 : 0;
    N.g.visible = NX.reduced || !(n.resp > 0 && Math.floor(n.resp * 10) % 2);
    var wet = 1 - 0.17 * n.wet; W.mat.legs.color.setRGB(wet, wet, wet * 1.02);
    // the amber ring at the pole whose button still needs a press (the north one first, then the median's)
    var rk = S.done || !S.playing ? -1 : S.zone === "north" ? 0 : S.zone === "median" ? 1 : -1;
    if (rk >= 0 && (S.sig.called[rk] || S.sig.serve[rk])) rk = -1;
    W.ring.visible = rk >= 0;
    if (rk >= 0) { var bp = rk ? NX.L.btnS : NX.L.btnN; W.ring.position.set(bp.x, 0.14, bp.z); W.ring.scale.setScalar(NX.reduced ? 1 : 1 + 0.12 * Math.sin(S.t * 4)); }
    // the signal heads
    for (i = 0; i < 2; i++) {
      var ped = S.sig.ped[i];
      W.drawHead(i, ped === "flash" ? (Math.floor(S.t * 2) % 2 ? "flashOff" : "flashOn") : ped, S.sig.n[i]);
    }
    // dusk: the sky and the light follow the clock
    var k = NX.clamp(S.t / 170, 0, 1);
    skyC.copy(DUSK0).lerp(DUSK1, k); scene.background.copy(skyC); fog.color.copy(skyC);
    hemi.intensity = 0.85 - 0.4 * k; sun.intensity = 0.45 * (1 - k);
    if (S.lit) { W.mat.glow.color.setRGB(1, 0.86, 0.62); W.mat.pool.opacity = 0.16; } else { W.mat.glow.color.setRGB(0.35, 0.33, 0.3); W.mat.pool.opacity = 0; }
    W.laker.position.x = 200 - (S.t + introT) * 1.2;
    points(Math.min(dt, 0.1));
    cam(dt);
  }
  // flurries around Nick, the splashes (a pooled burst), Route 132's headlights
  NX.on("spray", function (p, o) { burst(p.x, p.z, 10, o.dir, 0.6); });
  NX.on("splash", function (p) { var n = sim.S.nick; burst(p.x, p.z, 26, 0, 1.0, n.x, n.z); });
  function burst(x, z, cnt, dir, k, tx, tz) {                // (Math.random: the spray is looks only, and NX.rnd is the sim's seeded stream)
    var a = W.pts.splash, pos = W.pts.pos;
    for (var j = 0; j < cnt; j++) {
      var i = a[0] + (spN++ % (a[1] - a[0])), b = i * 3;
      pos[b] = x + (Math.random() - 0.5) * 1.6; pos[b + 1] = 0.1; pos[b + 2] = z + (Math.random() - 0.5) * 1.0;
      var aimX = tx !== undefined ? (tx - x) * 1.2 : dir * 2, aimZ = tx !== undefined ? (tz - z) * 1.2 : (Math.random() - 0.5) * 2;
      vel[b] = aimX + (Math.random() - 0.5) * 2; vel[b + 1] = (2.4 + Math.random() * 2.6) * k; vel[b + 2] = aimZ + (Math.random() - 0.5) * 2;
    }
  }
  function points(dt) {
    if (!dt) return;
    var pos = W.pts.pos, n = sim.S.nick, a = W.pts.snow, i, b;
    for (i = a[0]; i < a[1]; i++) {
      b = i * 3; pos[b + 1] -= dt * (0.7 + (i % 5) * 0.08); if (!NX.reduced) pos[b] += Math.sin(pos[b + 1] + i) * dt * 0.3;
      if (pos[b + 1] < 0) pos[b + 1] += 14;
      if (pos[b] - n.x > 30) pos[b] -= 60; else if (pos[b] - n.x < -30) pos[b] += 60;
      if (pos[b + 2] - n.z > 25) pos[b + 2] -= 50; else if (pos[b + 2] - n.z < -25) pos[b + 2] += 50;
    }
    a = W.pts.splash;
    for (i = a[0]; i < a[1]; i++) {
      b = i * 3; if (pos[b + 1] < -1) continue;
      vel[b + 1] -= 9.8 * dt; pos[b] += vel[b] * dt; pos[b + 1] += vel[b + 1] * dt; pos[b + 2] += vel[b + 2] * dt;
      if (pos[b + 1] < 0) pos[b + 1] = -50;
    }
    a = W.pts.lights;
    for (i = a[0]; i < a[1]; i++) {
      b = i * 3; var d = pos[b + 2] > -37.5 ? -1 : 1; pos[b] += d * 24 * dt;
      if (pos[b] > 200) pos[b] -= 400; else if (pos[b] < -200) pos[b] += 400;
    }
    W.pts.geo.attributes.position.needsUpdate = true;
  }
  // the camera: the opening shot looks north over the road to the river; play follows Nick from behind
  function cam(dt) {
    var S = sim.S, n = S.nick, port = camera.aspect < 0.8;
    if (mode === "intro" && !S.playing) {
      introT += dt;
      tPos.set(9 + (NX.reduced ? 0 : Math.sin(introT * 0.1) * 2), 6.5, 16); tLook.set(-6, 3.5, -30);
      camPos.copy(tPos); camLook.copy(tLook);
    } else {
      var fx = n.x * 0.55;
      if (S.done && !S.late) { tPos.set(-7, 4.4, 8.5); tLook.set(7, 1.2, 20); }                // the doors, the van, the two cameos parked east of them
      else if (port) { tPos.set(fx, 9.2, n.z - 10.5); tLook.set(fx, 0.5, n.z + 5.5); }
      else { tPos.set(fx, 6.4, n.z - 8.8); tLook.set(fx, 0.8, n.z + 7); }
      var kk = 1 - Math.exp(-(dt || 0.016) * 3.2);
      camPos.lerp(tPos, kk); camLook.lerp(tLook, kk);
    }
    camera.position.copy(camPos); camera.lookAt(camLook);
  }
  var L = NX.L;
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();

</script>
</body>
</html>
